name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/wonderful-maxwell-o98pwg, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # 저장소 Settings > Secrets and variables > Actions > Variables 의 SHEET_URL
          VITE_SHEET_URL: ${{ vars.SHEET_URL }}
          # 카카오 개발자 콘솔의 JavaScript 키 (없으면 휴대폰 공유 창으로 대신 보냄)
          VITE_KAKAO_KEY: ${{ vars.KAKAO_KEY }}
          # 사이트 아래 사업자 정보 (저장소 변수에만 두고 코드에는 적지 않는다 — src/config/business.ts). Secrets 탭에 넣어도 읽는다
          VITE_BIZ_NAME: ${{ vars.BIZ_NAME || secrets.BIZ_NAME }}
          VITE_BIZ_OWNER: ${{ vars.BIZ_OWNER || secrets.BIZ_OWNER }}
          VITE_BIZ_REG_NO: ${{ vars.BIZ_REG_NO || secrets.BIZ_REG_NO }}
          VITE_BIZ_MAIL_ORDER_NO: ${{ vars.BIZ_MAIL_ORDER_NO || secrets.BIZ_MAIL_ORDER_NO }}
          VITE_BIZ_ADDRESS: ${{ vars.BIZ_ADDRESS || secrets.BIZ_ADDRESS }}
          VITE_BIZ_PHONE: ${{ vars.BIZ_PHONE || secrets.BIZ_PHONE }}
          VITE_BIZ_EMAIL: ${{ vars.BIZ_EMAIL || secrets.BIZ_EMAIL }}
          VITE_BIZ_HOURS: ${{ vars.BIZ_HOURS || secrets.BIZ_HOURS }}
          # 결제 (공개돼도 되는 값만 — 포트원 API Secret은 결제 함수 비밀값에만). 결제 전(BETA_FREE)에는 쓰이지 않는다
          VITE_PAY_API: ${{ vars.PAY_API }}
          VITE_PORTONE_STORE_ID: ${{ vars.PORTONE_STORE_ID }}
          VITE_PORTONE_CHANNEL_KEY: ${{ vars.PORTONE_CHANNEL_KEY }}
          VITE_PORTONE_TEST_CHANNEL_KEY: ${{ vars.PORTONE_TEST_CHANNEL_KEY }}
          VITE_REVIEW_TOKEN: ${{ vars.REVIEW_TOKEN }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
